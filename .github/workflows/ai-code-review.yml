name: AI Code Review (Copilot Gate)

on:
  workflow_call:

# Deliberately no permissions block: the token is inherited from the caller (it can never be
# widened here), so the fallback request only works where the caller grants pull-requests: write.

jobs:
  ai-code-review:
    name: AI Code Review (Copilot Gate)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for Copilot review
        run: |
          set -euo pipefail

          # Guard: PR context must be available (inherited from caller's event).
          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::No pull_request context available (github.event.pull_request.number is empty)."
            echo "::error::This reusable workflow must be called from a pull_request / pull_request_review triggered workflow."
            exit 1
          fi

          POLL_INTERVAL=20
          MAX_WAIT=1800  # 30 minutes
          ELAPSED=0
          # Rulesets ask Copilot almost immediately after a PR opens; leave them this head start.
          GRACE_SECONDS=60
          FALLBACK_DONE=0

          echo "🤖 Waiting for a Copilot or Gemini Code Assist review on PR #${PR_NUMBER}..."
          echo ""

          while true; do
            REVIEWS_JSON=$(gh api --paginate --slurp \
              "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" | jq 'add // []')

            # Only these exact bot logins count; similarly named accounts are ignored.
            BOT_REVIEW=$(echo "$REVIEWS_JSON" | jq -r '
              [ .[] | select(.user.login | IN("copilot-pull-request-reviewer[bot]", "copilot", "gemini-code-assist[bot]")) ]
              | sort_by(.submitted_at) | last // empty
            ')

            if [ -n "$BOT_REVIEW" ] && [ "$BOT_REVIEW" != "null" ]; then
              REVIEW_TIME=$(echo "$BOT_REVIEW" | jq -r '.submitted_at')
              REVIEW_STATE=$(echo "$BOT_REVIEW" | jq -r '.state')
              REVIEW_USER=$(echo "$BOT_REVIEW" | jq -r '.user.login')
              echo "✅ Bot code review found!"
              echo "   Reviewer: ${REVIEW_USER}"
              echo "   State: ${REVIEW_STATE}"
              echo "   Submitted at: ${REVIEW_TIME}"
              exit 0
            fi

            # requested_reviewers hides Copilot while its review runs; only the timeline shows earlier requests.
            if [ "$FALLBACK_DONE" = 0 ]; then
              if ! PR_INFO=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}"); then
                FALLBACK_DONE=1
                echo "::warning::PR #${PR_NUMBER} could not be read, so the gate will not ask Copilot itself."
              elif [ $(( $(date +%s) - $(echo "$PR_INFO" | jq -r '.created_at | fromdateiso8601') )) -ge "$GRACE_SECONDS" ]; then
                FALLBACK_DONE=1
                if ! EVENTS_JSON=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR_NUMBER}/timeline?per_page=100"); then
                  echo "::warning::PR timeline is not readable, so the gate will not ask Copilot itself."
                elif [ "$(echo "$EVENTS_JSON" | jq '[ add // [] | .[]
                      | select(.event == "review_requested"
                               and ((.requested_reviewer.login // "") | ascii_downcase
                                    | . == "copilot" or . == "copilot-pull-request-reviewer"
                                      or . == "copilot-pull-request-reviewer[bot]")) ]
                      | length')" -eq 0 ]; then
                  echo "  🔁 No Copilot request found on this PR, asking Copilot once."
                  # Use GraphQL: REST accepts the reviewer silently even when Copilot declines the request.
                  ASK_RESULT=$(gh api graphql -f id="$(echo "$PR_INFO" | jq -r '.node_id')" \
                    -f query='mutation($id: ID!) { requestCopilotCodeReview(input: {pullRequestId: $id}) { success failureReason } }' \
                    2>&1) || true
                  ASK_OK=$(echo "$ASK_RESULT" | jq -r '.data.requestCopilotCodeReview.success // false' 2>/dev/null || true)
                  ASK_REASON=$(echo "$ASK_RESULT" | jq -r '.data.requestCopilotCodeReview.failureReason // empty' 2>/dev/null || true)
                  # An annotation stops at its first newline; flatten the raw output before reporting it.
                  ASK_TEXT=$(echo "$ASK_RESULT" | tr '\n' ' ')
                  if [ "$ASK_OK" = true ]; then
                    echo "  ✅ Copilot has been asked to review."
                  elif [ -n "$ASK_REASON" ]; then
                    echo "::warning::Copilot refused the review request (${ASK_REASON}). An organization owner should review the Copilot code review settings; until then request the review by hand."
                  else
                    echo "::warning::The Copilot review API call failed: ${ASK_TEXT}| Callers need pull-requests: write and fork PRs stay read-only; request the review by hand."
                  fi
                fi
              fi
            fi

            ELAPSED=$((ELAPSED + POLL_INTERVAL))
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo ""
              echo "::error::⏰ Timeout: neither Copilot nor Gemini Code Assist reviewed within ${MAX_WAIT}s."
              echo "::error::Once a bot review is submitted, the pull_request_review event runs this workflow again."
              exit 1
            fi

            echo "  ⏳ [${ELAPSED}s/${MAX_WAIT}s] No bot code review yet, polling again in ${POLL_INTERVAL}s..."
            sleep "$POLL_INTERVAL"
          done
