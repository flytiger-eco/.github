name: AI Code Review (Copilot Gate)

on:
  workflow_call:

# Deliberately no permissions block: the token is inherited from the caller (it can never be
# widened here), so the fallback request only works where the caller grants pull-requests: write.

jobs:
  ai-code-review:
    name: AI Code Review (Copilot Gate)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Wait for Copilot review
        run: |
          set -euo pipefail

          # Guard: PR context must be available (inherited from caller's event).
          if [ -z "${PR_NUMBER}" ]; then
            echo "::error::No pull_request context available (github.event.pull_request.number is empty)."
            echo "::error::This reusable workflow must be called from a pull_request / pull_request_review triggered workflow."
            exit 1
          fi

          POLL_INTERVAL=20
          MAX_WAIT=1800  # 30 minutes
          ELAPSED=0
          # Rulesets ask Copilot almost immediately after a PR opens; leave them this head start.
          GRACE_SECONDS=60
          FALLBACK_DONE=0

          echo "🤖 Waiting for Copilot code review on PR #${PR_NUMBER}..."
          echo ""

          while true; do
            REVIEWS_JSON=$(gh api --paginate --slurp \
              "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" | jq 'add // []')

            # Check for Copilot review: user.login matches copilot-pull-request-reviewer[bot] or copilot
            COPILOT_REVIEW=$(echo "$REVIEWS_JSON" | jq -r '
              [ .[] | select(.user.login == "copilot-pull-request-reviewer[bot]" or .user.login == "copilot") ]
              | sort_by(.submitted_at) | last // empty
            ')

            if [ -n "$COPILOT_REVIEW" ] && [ "$COPILOT_REVIEW" != "null" ]; then
              REVIEW_TIME=$(echo "$COPILOT_REVIEW" | jq -r '.submitted_at')
              REVIEW_STATE=$(echo "$COPILOT_REVIEW" | jq -r '.state')
              REVIEW_USER=$(echo "$COPILOT_REVIEW" | jq -r '.user.login')
              echo "✅ Copilot review detected!"
              echo "   Reviewer: ${REVIEW_USER}"
              echo "   State: ${REVIEW_STATE}"
              echo "   Submitted at: ${REVIEW_TIME}"
              exit 0
            fi

            # requested_reviewers hides Copilot while its review runs; only the timeline shows earlier requests.
            if [ "$FALLBACK_DONE" = 0 ]; then
              if ! PR_INFO=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}"); then
                FALLBACK_DONE=1
                echo "::warning::PR #${PR_NUMBER} could not be read, so the gate will not ask Copilot itself."
              elif [ $(( $(date +%s) - $(echo "$PR_INFO" | jq -r '.created_at | fromdateiso8601') )) -ge "$GRACE_SECONDS" ]; then
                FALLBACK_DONE=1
                if ! EVENTS_JSON=$(gh api --paginate --slurp "repos/${REPO}/issues/${PR_NUMBER}/timeline?per_page=100"); then
                  echo "::warning::PR timeline is not readable, so the gate will not ask Copilot itself."
                elif [ "$(echo "$EVENTS_JSON" | jq '[ add // [] | .[]
                      | select(.event == "review_requested"
                               and ((.requested_reviewer.login // "") | ascii_downcase | startswith("copilot"))) ]
                      | length')" -eq 0 ]; then
                  echo "  🔁 No Copilot request found on this PR, asking Copilot once."
                  # Use GraphQL: REST accepts the reviewer silently even when Copilot declines the request.
                  ASK_RESULT=$(gh api graphql -f id="$(echo "$PR_INFO" | jq -r '.node_id')" \
                    -f query='mutation($id: ID!) { requestCopilotCodeReview(input: {pullRequestId: $id}) { success failureReason } }' \
                    2>&1) || true
                  if [ "$(echo "$ASK_RESULT" | jq -r '.data.requestCopilotCodeReview.success // false' 2>/dev/null)" = true ]; then
                    echo "  ✅ Copilot has been asked to review."
                  else
                    ASK_REASON=$(echo "$ASK_RESULT" | jq -r '.data.requestCopilotCodeReview.failureReason // empty' 2>/dev/null || true)
                    echo "::warning::Copilot declined or could not be asked (${ASK_REASON:-${ASK_RESULT}}). Callers need pull-requests: write and fork PRs stay read-only; request the review by hand."
                  fi
                fi
              fi
            fi

            ELAPSED=$((ELAPSED + POLL_INTERVAL))
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo ""
              echo "::error::⏰ Timeout: Copilot review not detected after ${MAX_WAIT}s."
              echo "::error::Copilot 尚未提交评审。Copilot 提交评审后会通过 pull_request_review 事件自动重跑此 workflow。"
              exit 1
            fi

            echo "  ⏳ [${ELAPSED}s/${MAX_WAIT}s] Copilot review not yet available, retrying in ${POLL_INTERVAL}s..."
            sleep "$POLL_INTERVAL"
          done
