name: Test Review Gates

on:
  pull_request:
    paths:
      - .github/workflows/human-review.yml
      - .github/workflows/ai-code-review.yml
      - .github/workflows/test-review-gates.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/human-review.yml
      - .github/workflows/ai-code-review.yml
      - .github/workflows/test-review-gates.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test Review Gates
    runs-on: ubuntu-latest
    # pull-requests: write so the live check can really ask Copilot when a PR here lacks a request.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract gate scripts and stubs
        run: |
          set -euo pipefail
          HUMAN_GATE="$RUNNER_TEMP/human-review.sh"
          AI_GATE="$RUNNER_TEMP/ai-code-review.sh"
          STUBS="$RUNNER_TEMP/stubs"
          {
            echo "HUMAN_GATE=$HUMAN_GATE"
            echo "AI_GATE=$AI_GATE"
            echo "STUBS=$STUBS"
          } >> "$GITHUB_ENV"

          yq -e '.jobs["human-review"].steps[] | select(.name == "Wait for human approval") | .run' \
            .github/workflows/human-review.yml > "$HUMAN_GATE"
          yq -e '.jobs["ai-code-review"].steps[] | select(.name == "Wait for Copilot review") | .run' \
            .github/workflows/ai-code-review.yml > "$AI_GATE"

          mkdir -p "$STUBS"
          # The gates only sleep when the awaited review was not found, so exit 99 means "still waiting".
          # Setting SLEEP_POLLS allows that many polls; FAKE_CLOCK moves forward by every sleep.
          cat > "$STUBS/sleep" <<'EOF'
          #!/bin/sh
          if [ -z "${SLEEP_POLLS:-}" ]; then exit 99; fi
          [ -z "${FAKE_CLOCK:-}" ] || echo $(( $(cat "$FAKE_CLOCK") + $1 )) > "$FAKE_CLOCK"
          done_polls=$(( $(cat "$SLEEP_STATE" 2>/dev/null || echo 0) + 1 ))
          echo "$done_polls" > "$SLEEP_STATE"
          if [ "$done_polls" -ge "$SLEEP_POLLS" ]; then exit 99; fi
          EOF
          cat > "$STUBS/date" <<'EOF'
          #!/bin/sh
          if [ -n "${FAKE_CLOCK:-}" ] && [ "$*" = "+%s" ]; then
            exec cat "$FAKE_CLOCK"
          fi
          exec /bin/date "$@"
          EOF
          cat > "$STUBS/gh" <<'EOF'
          #!/usr/bin/env bash
          if [ "${GH_FAIL:-0}" = 1 ]; then
            echo "gh: Server Error (HTTP 500)" >&2
            exit 1
          fi
          expected="api --paginate --slurp repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100"
          case "$*" in
            "$expected") cat "$GH_FIXTURE" ;;
            "api repos/${REPO}/collaborators/"*"/permission")
              if [ "${GH_PERMISSION_FAIL:-0}" = 1 ]; then
                echo "gh: Resource not accessible by integration (HTTP 403)" >&2
                exit 1
              fi
              reviewer=${2#repos/${REPO}/collaborators/}
              reviewer=${reviewer%/permission}
              jq -c --arg login "$reviewer" '{permission: .[$login]}' "$GH_PERMISSIONS_FIXTURE"
              ;;
            "api repos/${REPO}/pulls/${PR_NUMBER}")
              printf '{"node_id":"PR_probe","created_at":"%s"}\n' "${GH_PR_CREATED:-2026-01-01T00:00:00Z}"
              ;;
            "api --paginate --slurp repos/${REPO}/issues/${PR_NUMBER}/timeline?per_page=100")
              if [ "${GH_TIMELINE_FAIL:-0}" = 1 ]; then
                echo "gh: Resource not accessible by integration (HTTP 403)" >&2
                exit 1
              fi
              if [ "${GH_COPILOT_ASKED:-1}" = 1 ]; then
                printf '[[{"event":"review_requested","requested_reviewer":{"login":"%s"}}]]\n' "${GH_ASKED_LOGIN:-Copilot}"
              else
                echo '[[{"event":"labeled"},{"event":"review_requested","requested_reviewer":{"login":"bob"}}]]'
              fi
              ;;
            "api graphql -f id=PR_probe -f query="*"requestCopilotCodeReview"*)
              echo asked >> "$GH_ASK_LOG"
              if [ "${GH_ASK_FAIL:-0}" = 1 ]; then
                echo '{"errors":[{"type":"FORBIDDEN","message":"Resource not accessible by integration"}]}'
                echo "gh: Resource not accessible by integration" >&2
                exit 1
              fi
              if [ -n "${GH_ASK_REASON:-}" ]; then
                printf '{"data":{"requestCopilotCodeReview":{"success":false,"failureReason":"%s"}}}\n' "$GH_ASK_REASON"
              else
                echo '{"data":{"requestCopilotCodeReview":{"success":true,"failureReason":null}}}'
              fi
              ;;
            *)
              echo "unsupported gh invocation: $*" >&2
              exit 2
              ;;
          esac
          EOF
          chmod +x "$STUBS/sleep" "$STUBS/date" "$STUBS/gh"

      - name: Scenario tests
        run: |
          set -euo pipefail
          FAILED=0
          APPROVED=0 WAITING=99 ERROR=1
          COPILOT="copilot-pull-request-reviewer[bot]"
          ASK_LOG="$RUNNER_TEMP/copilot-asks.log"

          # Review specs use login:type:state[:association[:permission]]; defaults are NONE/write.
          fixture() {
            jq -nc '[$ARGS.positional | to_entries[] | (.value | split(":")) as [$u, $t, $s, $a, $p]
                     | {user: {login: $u, type: $t}, state: $s,
                        author_association: ($a // "NONE"),
                        submitted_at: (1767225600 + .key * 60 | todate)}]
                    | if length == 0 then [[]] else [range(0; length; 100) as $i | .[$i:$i + 100]] end' \
              --args "$@" > "$RUNNER_TEMP/fixture.json"
            jq -nc 'reduce $ARGS.positional[] as $spec ({};
                      ($spec | split(":")) as [$u, $t, $s, $a, $p] | .[$u] = ($p // "write"))' \
              --args "$@" > "$RUNNER_TEMP/permissions.json"
          }

          fillers() {
            for i in $(seq 1 "$1"); do echo "filler$i:User:COMMENTED"; done
          }

          # Usage: run_case <gate> <name> <expected exit> [specs...]; PR and the GH_* stub knobs may be set per call.
          run_case() {
            local gate=$1 name=$2 expected=$3 actual
            shift 3
            fixture "$@"
            : > "$ASK_LOG"
            rm -f "$RUNNER_TEMP/polls"
            local clock_file=""
            if [ -n "${CLOCK_START:-}" ]; then
              clock_file="$RUNNER_TEMP/clock"
              echo "$CLOCK_START" > "$clock_file"
            fi
            set +e
            PATH="$STUBS:$PATH" GH_FIXTURE="$RUNNER_TEMP/fixture.json" GH_FAIL="${GH_FAIL:-0}" \
              GH_PERMISSIONS_FIXTURE="$RUNNER_TEMP/permissions.json" GH_PERMISSION_FAIL="${GH_PERMISSION_FAIL:-0}" \
              GH_PR_CREATED="${GH_PR_CREATED:-}" GH_TIMELINE_FAIL="${GH_TIMELINE_FAIL:-0}" \
              GH_COPILOT_ASKED="${GH_COPILOT_ASKED:-1}" GH_ASKED_LOGIN="${GH_ASKED_LOGIN:-}" \
              GH_ASK_FAIL="${GH_ASK_FAIL:-0}" GH_ASK_REASON="${GH_ASK_REASON:-}" GH_ASK_LOG="$ASK_LOG" \
              SLEEP_POLLS="${SLEEP_POLLS:-}" SLEEP_STATE="$RUNNER_TEMP/polls" FAKE_CLOCK="$clock_file" \
              PR_NUMBER="${PR-42}" REPO=flytiger-eco/test bash "$gate" > "$RUNNER_TEMP/out.log" 2>&1
            actual=$?
            set -e
            if [ "$actual" = "$expected" ]; then
              echo "✓ ${name} (exit ${actual})"
            else
              echo "::error::✗ ${name}: expected exit ${expected}, got ${actual}"
              echo "::group::${name} output"; cat "$RUNNER_TEMP/out.log"; echo "::endgroup::"
              FAILED=1
            fi
          }

          # Usage: assert_asks <name> <count>; verifies how often the last case asked Copilot.
          assert_asks() {
            local asks
            asks=$(wc -l < "$ASK_LOG" | tr -d ' ')
            if [ "$asks" = "$2" ]; then
              echo "✓ ${1}: asked Copilot ${asks} time(s)"
            else
              echo "::error::✗ ${1}: expected ${2} Copilot ask(s), saw ${asks}"
              echo "::group::${1} output"; cat "$RUNNER_TEMP/out.log"; echo "::endgroup::"
              FAILED=1
            fi
          }

          # Usage: assert_logged <name> <extended regex>; a single line of the last case's output must match.
          assert_logged() {
            if grep -Eq "$2" "$RUNNER_TEMP/out.log"; then
              echo "✓ ${1}: expected log line present"
            else
              echo "::error::✗ ${1}: no log line matches ${2}"
              echo "::group::${1} output"; cat "$RUNNER_TEMP/out.log"; echo "::endgroup::"
              FAILED=1
            fi
          }

          echo "── human-review.yml"
          G=$HUMAN_GATE
          run_case $G "no reviews" $WAITING
          run_case $G "single approval" $APPROVED alice:User:APPROVED
          run_case $G "approval on page 2" $APPROVED $(fillers 100) alice:User:APPROVED
          run_case $G "changes requested on page 2 overrides approval" $WAITING \
            alice:User:APPROVED $(fillers 99) alice:User:CHANGES_REQUESTED
          run_case $G "comment after approval keeps approval" $APPROVED alice:User:APPROVED alice:User:COMMENTED
          run_case $G "re-approval after changes requested" $APPROVED alice:User:CHANGES_REQUESTED alice:User:APPROVED
          run_case $G "dismissed approval" $WAITING alice:User:DISMISSED
          run_case $G "bot approval ignored" $WAITING copilot:Bot:APPROVED
          run_case $G "one of two reviewers approves" $APPROVED alice:User:CHANGES_REQUESTED bob:User:APPROVED
          run_case $G "approval from repository owner" $APPROVED alice:User:APPROVED:OWNER:admin
          run_case $G "approval from org member" $APPROVED alice:User:APPROVED:MEMBER:write
          run_case $G "approval from unrelated account ignored" $WAITING stranger:User:APPROVED:NONE:read
          run_case $G "approval from fork contributor ignored" $WAITING forker:User:APPROVED:CONTRIBUTOR:none
          run_case $G "approval from private org admin" $APPROVED Mars-314:User:APPROVED:NONE:admin
          run_case $G "approval from private org writer" $APPROVED alice:User:APPROVED:NONE:write
          run_case $G "writer with blank association accepted" $APPROVED "alice:User:APPROVED::write"
          run_case $G "org member with read access skipped" $WAITING alice:User:APPROVED:MEMBER:read
          run_case $G "collaborator with read access skipped" $WAITING alice:User:APPROVED:COLLABORATOR:read
          run_case $G "bot with admin access skipped" $WAITING copilot:Bot:APPROVED:NONE:admin
          run_case $G "pending verdict skipped" $WAITING alice:User:PENDING:NONE:admin
          run_case $G "latest verdict survives association change" $WAITING \
            alice:User:APPROVED:MEMBER:write alice:User:CHANGES_REQUESTED:NONE:write
          run_case $G "trusted approval wins over untrusted one" $APPROVED \
            stranger:User:APPROVED:NONE:read alice:User:APPROVED:COLLABORATOR:write
          run_case $G "untrusted changes requested does not block" $APPROVED \
            alice:User:APPROVED:COLLABORATOR:write stranger:User:CHANGES_REQUESTED:NONE:read
          run_case $G "unrecognized access fails closed" $ERROR alice:User:APPROVED:NONE:unexpected
          run_case $G "empty access fails closed" $ERROR "alice:User:APPROVED:NONE:"
          GH_PERMISSION_FAIL=1 run_case $G "permission lookup failure" $ERROR alice:User:APPROVED
          GH_FAIL=1 run_case $G "API failure" $ERROR
          PR="" run_case $G "missing PR context" $ERROR

          echo "── ai-code-review.yml"
          G=$AI_GATE
          run_case $G "no reviews" $WAITING
          run_case $G "Copilot review" $APPROVED "$COPILOT:Bot:COMMENTED"
          run_case $G "Copilot review on page 2" $APPROVED $(fillers 100) "$COPILOT:Bot:COMMENTED"
          run_case $G "human reviews only" $WAITING alice:User:APPROVED $(fillers 120)
          run_case $G "other bot ignored" $WAITING other-bot:Bot:COMMENTED
          run_case $G "ruleset already asked Copilot" $WAITING
          assert_asks "ruleset already asked Copilot" 0
          GH_COPILOT_ASKED=0 run_case $G "no Copilot request anywhere" $WAITING bob:User:APPROVED
          assert_asks "no Copilot request anywhere" 1
          GH_COPILOT_ASKED=0 GH_PR_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            run_case $G "just-opened PR waits for the ruleset" $WAITING
          assert_asks "just-opened PR waits for the ruleset" 0
          GH_COPILOT_ASKED=0 GH_ASK_FAIL=1 run_case $G "rejected ask does not fail the gate" $WAITING
          assert_asks "rejected ask does not fail the gate" 1
          assert_logged "rejected ask does not fail the gate" \
            '^::warning::The Copilot review API call failed: .*Callers need pull-requests: write'
          GH_COPILOT_ASKED=0 GH_ASK_REASON=REPOSITORY_INELIGIBLE run_case $G "ineligible repository is reported" $WAITING
          assert_asks "ineligible repository is reported" 1
          assert_logged "ineligible repository is reported" \
            '^::warning::Copilot refused the review request \(REPOSITORY_INELIGIBLE\)\. An organization owner'
          GH_COPILOT_ASKED=0 GH_TIMELINE_FAIL=1 run_case $G "no timeline access means no ask" $WAITING
          assert_asks "no timeline access means no ask" 0
          GH_COPILOT_ASKED=0 run_case $G "finished Copilot review needs no ask" $APPROVED "$COPILOT:Bot:COMMENTED"
          assert_asks "finished Copilot review needs no ask" 0
          GH_ASKED_LOGIN=copilot-reviewer run_case $G "copilot-prefixed account is not Copilot" $WAITING
          assert_asks "copilot-prefixed account is not Copilot" 1
          GH_ASKED_LOGIN="$COPILOT" run_case $G "Copilot bot login is recognized" $WAITING
          assert_asks "Copilot bot login is recognized" 0
          GH_COPILOT_ASKED=0 SLEEP_POLLS=4 run_case $G "successful ask is not repeated" $WAITING
          assert_asks "successful ask is not repeated" 1
          GH_COPILOT_ASKED=0 GH_ASK_FAIL=1 SLEEP_POLLS=4 run_case $G "rejected ask is not retried" $WAITING
          assert_asks "rejected ask is not retried" 1
          # Fake clock: 10s after the PR opened, +20s per poll, so the 60s head start ends on poll 4.
          GH_COPILOT_ASKED=0 GH_PR_CREATED=2026-01-01T00:00:00Z CLOCK_START=1767225610 SLEEP_POLLS=3 \
            run_case $G "no ask during the head start" $WAITING
          assert_asks "no ask during the head start" 0
          GH_COPILOT_ASKED=0 GH_PR_CREATED=2026-01-01T00:00:00Z CLOCK_START=1767225610 SLEEP_POLLS=5 \
            run_case $G "ask right after the head start" $WAITING
          assert_asks "ask right after the head start" 1
          GH_FAIL=1 run_case $G "API failure" $ERROR
          PR="" run_case $G "missing PR context" $ERROR

          exit "$FAILED"

      - name: Live API check
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          FAILED=0
          mkdir -p "$RUNNER_TEMP/sleep-only"
          cp "$STUBS/sleep" "$RUNNER_TEMP/sleep-only/sleep"
          for gate in "$HUMAN_GATE" "$AI_GATE"; do
            name=$(basename "$gate" .sh)
            PATH="$RUNNER_TEMP/sleep-only:$PATH" bash "$gate" > "$RUNNER_TEMP/live.log" 2>&1
            code=$?
            echo "::group::${name} output against the real API"; cat "$RUNNER_TEMP/live.log"; echo "::endgroup::"
            case "$code" in
              0) echo "✓ ${name}: passed against the real API (awaited review already present)" ;;
              99) echo "✓ ${name}: reached the polling wait against the real API" ;;
              *)
                echo "::error::${name} failed against the real API with exit ${code}"
                cat "$RUNNER_TEMP/live.log"
                FAILED=1
                ;;
            esac
          done
          exit "$FAILED"

  # Live scenario: call the gate exactly as a real caller does, on this pull request. Stubbed
  # cases cover the decision logic; this one shows the gate holds the pipeline until an account
  # with push rights approves. The wait window is the gate's own 360 minutes.
  approval-gate:
    name: Approval Gate (live)
    needs: test
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/human-review.yml
